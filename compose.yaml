services:
  portfolio:
    build:
      context: .
      target: runtime
    image: portfolio:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100

networks:
  default:
    name: portfolio
